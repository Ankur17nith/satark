name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test
      - name: Check published numbers are current
        run: |
          npm run evidence
          git diff --exit-code evidence/ || (echo "evidence/ is out of date: run npm run evidence and commit" && exit 1)
